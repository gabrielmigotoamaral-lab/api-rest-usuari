# Configuração do banco MySQL
# Usuário e senha podem ser sobrescritos pelas variáveis de ambiente DB_USERNAME e DB_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/usuariosdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Mostra o SQL no console (útil pra aprender). Desligado para não poluir o menu do terminal; troque para true se quiser ver
spring.jpa.show-sql=false
# update: cria/ajusta as tabelas sem apagar os dados entre reinicializações
spring.jpa.hibernate.ddl-auto=update
