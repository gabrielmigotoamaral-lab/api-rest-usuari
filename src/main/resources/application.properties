# Banco MySQL (roda no Docker)
# da pra trocar usuario/senha com DB_USERNAME e DB_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/usuariosdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# true mostra o SQL no console, deixei false pq baguncava o menu
spring.jpa.show-sql=false
# update = cria as tabelas sem apagar os dados
spring.jpa.hibernate.ddl-auto=update
